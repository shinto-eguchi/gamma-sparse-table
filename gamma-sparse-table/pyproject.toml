[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamma-sparse-table"
version = "0.1.0"
description = "Log-gamma estimation experiments for sparse contingency tables under sparse-cell noise."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Shinto Eguchi", email = "eguchi@ism.ac.jp"}
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "joblib>=1.2",
  "tabulate>=0.9"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
